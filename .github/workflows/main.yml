name: GitHub Snake

on:
  schedule:
    - cron: '0 * * * *' # roda a cada hora
  workflow_dispatch:

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Run Snake Game
        uses: platane/snk@v1
        with:
          github_user_name: isabele-eduarda      # substitua pelo seu username
          svg_out_path: snake.svg            # caminho do arquivo gerado
